<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Materials - CAPACITY CONNECT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .topbar {
            background: #0d6efd;
            color: white;
            padding: 20px 25px;
        }

        .upload-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .form-label {
            font-weight: 600;
        }

        .material-icon {
            font-size: 45px;
            color: #0d6efd;
        }
    </style>
</head>

<body>

    <div class="topbar">
        <h3 class="mb-1">
            <i class="bi bi-cloud-upload"></i> Upload Materials
        </h3>
        <small>CAPACITY CONNECT – Trainer Portal</small>
    </div>

    <div class="container py-4">

        <div class="upload-card">

            <div class="text-center mb-4">
                <i class="bi bi-cloud-arrow-up material-icon"></i>
                <h4 class="mt-2">Upload Learning Material</h4>
                <p class="text-muted">
                    Add courses, presentations, videos and study documents.
                </p>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Course</label>
                <select class="form-select">
                    <option selected>Select a course</option>
                    <option>Data Analytics</option>
                    <option>Web Technology</option>
                    <option>Advanced Excel</option>
                    <option>Communication Skills</option>
                    <option>Professional Development</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Material Title</label>
                <input type="text" class="form-control"
                       placeholder="Enter material title">
            </div>

            <div class="mb-3">
                <label class="form-label">Material Type</label>
                <select class="form-select">
                    <option selected>Select material type</option>
                    <option>PDF Document</option>
                    <option>Presentation</option>
                    <option>Video</option>
                    <option>Study Material</option>
                    <option>Questionnaire</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Choose File</label>
                <input type="file" class="form-control">
            </div>

            <button class="btn btn-primary w-100"
                    onclick="uploadMaterial()">
                <i class="bi bi-upload"></i> Upload Material
            </button>

            <div class="text-center mt-3">
                <a href="trainer.html" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Dashboard
                </a>
            </div>

        </div>

    </div>

    <script>
        function uploadMaterial() {
            alert("Material uploaded successfully!");
        }
    </script>

</body>
</html>
